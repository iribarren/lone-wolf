# yaml-language-server: $schema=../vendor/symfony/routing/Loader/schema/routing.schema.json

# This file is the entry point to configure the routes of your app.
# Methods with the #[Route] attribute are automatically imported.
# See also https://symfony.com/doc/current/routing.html

# To list all registered routes, run the following command:
#   bin/console debug:router

controllers:
    resource: routing.controllers

# Firewall-intercepted login endpoint: the json_login authenticator handles
# POST /api/auth/login before any controller is resolved (T020).
api_auth_login:
    path: /api/auth/login
    methods: [POST]

# Backoffice sign-in form (FR-030). GET renders the EasyAdmin login page;
# POST is intercepted by the admin firewall's form_login authenticator.
admin_login:
    path: /admin/login
    controller: App\Identity\Infrastructure\Admin\AdminLoginController::index
    methods: [GET, POST]

# Matched by the admin firewall's logout listener (route-name match): it
# invalidates the session and redirects to logout.target (/) without this
# route's controller ever resolving.
app_logout:
    path: /admin/logout
