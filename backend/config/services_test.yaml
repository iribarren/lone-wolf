# Behat contexts are resolved FROM the Symfony test container by
# FriendsOfBehat\SymfonyExtension (constructor injection works).
services:
    App\Tests\Acceptance\Context\:
        resource: '../tests/Acceptance/Context/'
        public: true
        autowire: true
        autoconfigure: false

    Symfony\Bundle\FrameworkBundle\KernelBrowser: '@test.client'

    # Integration tests pull these handlers straight from the test container.
    App\Rulesets\Application\CreateGameSystemHandler:
        public: true
        autowire: true
    App\Rulesets\Application\UpdateFlowDefinitionHandler:
        public: true
        autowire: true
