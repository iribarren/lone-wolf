# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    # Shared-kernel port bindings (Constitution IV — injectable time/randomness).
    App\Shared\Domain\ClockInterface: '@App\Shared\Infrastructure\Time\SystemClock'
    App\Shared\Domain\RandomSourceInterface: '@App\Shared\Infrastructure\Rng\ProductionRandomSource'

    # Identity port binding (Constitution I).
    App\Identity\Application\UserRepositoryInterface: '@App\Identity\Infrastructure\Persistence\UserRepository'
    App\Rulesets\Application\Port\RulesetRepositoryInterface: '@App\Rulesets\Infrastructure\Persistence\PersistenceRulesetRepository'
    App\Rulesets\Application\Port\StageOccupancyCheckerInterface: '@App\Rulesets\Infrastructure\Persistence\DoctrineStageOccupancyChecker'

    # Campaigns/Journal port bindings (US2, Constitution I).
    App\Campaigns\Application\Port\CampaignRepositoryInterface: '@App\Campaigns\Infrastructure\Persistence\PersistenceCampaignRepository'
    App\Campaigns\Application\Port\FlowDefinitionProviderInterface: '@App\Campaigns\Infrastructure\Persistence\DoctrineFlowDefinitionProvider'
    App\Journal\Application\Port\JournalEntryRepositoryInterface: '@App\Journal\Infrastructure\Persistence\PersistenceJournalEntryRepository'

when@test:
    imports:
        - { resource: services_test.yaml }
