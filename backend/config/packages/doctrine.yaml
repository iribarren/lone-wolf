doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'

        # Native PostgreSQL binary-JSON columns (data-model.md persistence notes).
        types:
            jsonb: App\Shared\Infrastructure\Persistence\Types\JsonbType

        # IMPORTANT: You MUST configure your server version,
        # either here or in the DATABASE_URL env var (see .env file)
        #server_version: '16'

        profiling_collect_backtrace: '%kernel.debug%'
    orm:
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore
        identity_generation_preferences:
            Doctrine\DBAL\Platforms\PostgreSQLPlatform: identity
        auto_mapping: true
        # One mapping root per bounded context (Constitution II) — no global Entity/ folder.
        mappings:
            Rulesets:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Rulesets/Infrastructure/Persistence'
                prefix: 'App\Rulesets\Infrastructure\Persistence'
                alias: Rulesets
            Campaigns:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Campaigns/Infrastructure/Persistence'
                prefix: 'App\Campaigns\Infrastructure\Persistence'
                alias: Campaigns
            Journal:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Journal/Infrastructure/Persistence'
                prefix: 'App\Journal\Infrastructure\Persistence'
                alias: Journal
            Oracles:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Oracles/Infrastructure/Persistence'
                prefix: 'App\Oracles\Infrastructure\Persistence'
                alias: Oracles
            Characters:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Characters/Infrastructure/Persistence'
                prefix: 'App\Characters\Infrastructure\Persistence'
                alias: Characters
            Identity:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Identity/Infrastructure/Persistence'
                prefix: 'App\Identity\Infrastructure\Persistence'
                alias: Identity

when@test:
    doctrine:
        dbal:
            # "TEST_TOKEN" is typically set by ParaTest
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
